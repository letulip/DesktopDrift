<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Desktop Drift</title>
<meta name="description" content="Time Attack race in Desktop Drift.">
<meta name="robots" content="noindex, follow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desktop Drift">
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/sandbox.css" />
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="hud-left">
    <div class="panel" id="timePanel">
      <div>lap: <span class="big" id="lap">0.00</span> s</div>
      <div class="dim">last: <span id="last">—</span></div>
      <div class="dim">best: <span id="best">—</span></div>
    </div>
    <canvas id="mini" width="156" height="134"></canvas>
  </div>
  <div id="controls">
    <button id="menuBtn" title="back to menu">☰ Menu</button>
  </div>
  <div id="hud-right">
    <div class="panel" id="scorePanel">
      <div>score: <span class="big" id="score">0</span></div>
      <div class="dim" id="lapScores"></div>
      <div class="dim">speed: <span id="spd">0.0</span> <span id="spdUnit"></span></div>
    </div>
    <div id="lapCounter"><span id="lapNum">1</span>/-</div>
  </div>
</div>
<div id="combo"></div>
<div id="flash"></div>
<div id="count"></div>
<div id="hint">Hold the LEFT half of the screen to steer left, the RIGHT half to steer right (or ← → keys). Drift through the corners. Dodge the obstacles!</div>

<script type="module">
  import { TRACKS }    from './js/track-registry.js';
  import { startGame } from './js/game-engine.js';

  const trackId = new URLSearchParams(location.search).get('track') ?? '';
  const meta    = TRACKS.find(t => t.id === trackId);

  // Invalid or missing track → back to track selection
  if (!meta) { location.replace('tracks.html'); throw new Error('unknown track'); }

  // Tab title from the registry name
  document.title = `Desktop Drift — ${meta.name}`;

  // Dynamic import: the module contains a top-level await (SVG fetch),
  // so import() resolves only once the track is fully initialised.
  const T = await import(`./js/track-${meta.id}.js`);
  startGame(T, { initItems: true });
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
