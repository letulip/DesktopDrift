<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Desktop Drift — Time Attack</title>
  <meta name="description" content="Choose your Time Attack circuit in Desktop Drift. Each track is a different surface — desk, kitchen, café. Pick one and beat your best lap.">
  <meta name="robots" content="noindex, follow">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <meta name="theme-color" content="#14110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desktop Drift">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/tracks.css">
  <link rel="stylesheet" href="css/wallet.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/content.css">
</head>
<body>
<div id="track-select">

  <header id="ts-header">
    <div class="ts-header-row">
      <div class="ts-header-text">
        <h1 id="ts-title">Time Attack</h1>
        <p  id="ts-sub">Choose a track</p>
      </div>
      <div class="wallet-pill" title="Tire coins">🛞 <span id="wallet-amount">0</span></div>
    </div>
    <div id="ts-mode">
      <button class="mode-btn is-active" id="btn-normal">Normal</button>
      <button class="mode-btn" id="btn-reversed">Reversed</button>
    </div>
  </header>

  <div id="content">
    <div id="track-cards"></div>
  </div>

  <footer id="ts-footer">
    <a href="index.html" class="ts-back">← Back to menu</a>
  </footer>

</div>

<script type="module">
  import { TRACKS } from './js/track-registry.js';
  import { records, collectedCaps, tiresFor, wallet } from './js/store.js';
  import { svgToCentreline, instanceId } from './js/track-util.js';
  import { initWalletHistory } from './js/wallet-history.js';

  document.getElementById('wallet-amount').textContent = wallet();
  initWalletHistory(document.querySelector('.wallet-pill'));

  // ── Track preview rendering on canvas ───────────────────────────────────────
  const TRACK_GU = 100;

  async function drawThumb(canvas, svgSrc, theme) {
    const th = {
      background: theme?.background ?? '#0b0907',
      table:      theme?.table      ?? '#2e241a',
      tableEdge:  theme?.tableEdge  ?? '#5a4a36',
      track:      theme?.track      ?? '#ffb14d',
    };

    let text;
    try { text = await fetch(svgSrc).then(r => r.text()); }
    catch { return; }

    try {
      const pts = svgToCentreline(text);
      if (!pts) return;

      const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);

      const extW = maxX - minX + TRACK_GU * 2;
      const extH = maxY - minY + TRACK_GU * 2;
      const pad  = 10;
      const sx   = (canvas.width  - pad * 2) / extW;
      const sy   = (canvas.height - pad * 2) / extH;
      const s    = Math.min(sx, sy);
      const ox   = (canvas.width  - extW * s) / 2 + TRACK_GU * s;
      const oy   = (canvas.height - extH * s) / 2 + TRACK_GU * s;
      const toC  = p => ({ x: (p.x - minX) * s + ox, y: (p.y - minY) * s + oy });

      const cx = canvas.getContext('2d');

      cx.fillStyle = th.background;
      cx.fillRect(0, 0, canvas.width, canvas.height);

      const ti = 5, tr = 5;
      cx.beginPath();
      cx.roundRect(ti, ti, canvas.width - ti * 2, canvas.height - ti * 2, tr);
      cx.fillStyle = th.table; cx.fill();
      cx.strokeStyle = th.tableEdge; cx.lineWidth = 2; cx.stroke();

      cx.lineWidth   = TRACK_GU * 2 * s;
      cx.strokeStyle = th.track;
      cx.lineCap     = 'round';
      cx.lineJoin    = 'round';
      cx.beginPath();
      pts.forEach((p, idx) => {
        const { x, y } = toC(p);
        idx === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
      });
      cx.closePath();
      cx.stroke();
    } catch { /* render error — canvas keeps its fallback background */ }
  }

  // ── Best PPS record (keyed by instance: trackId, or trackId:rev for reversed) ──
  function bestRecord(instId) {
    const ta = records()?.[instId]?.timeattack;
    if (ta?.bestPPS == null) return null;
    return { pps: Math.round(ta.bestPPS), total: ta.bestPPSTotal, time: ta.bestPPSTime };
  }
  const starsOf       = (pps) => Math.min(5, Math.floor((pps ?? 0) / 100));
  const REV_UNLOCK    = 3;   // reversed unlocks at 3★ on the forward lap
  const forwardStars  = (trackId) => starsOf(bestRecord(trackId)?.pps);

  // ── Build the track cards for a direction (normal / reversed) ──────────────────
  const container = document.getElementById('track-cards');

  function renderCards(reversed) {
    container.innerHTML = '';

    for (const track of TRACKS) {
      const inst   = instanceId(track.id, reversed);
      const locked = reversed && forwardStars(track.id) < REV_UNLOCK;
      const record = locked ? null : bestRecord(inst);

      // Locked reversed cards are inert <div>s; everything else is a link into the garage.
      const card = document.createElement(locked ? 'div' : 'a');
      card.className = 'track-card' + (locked ? ' is-locked' : '');
      if (!locked) card.href = `select.html?track=${encodeURIComponent(track.id)}${reversed ? '&dir=rev' : ''}`;

      const top = document.createElement('div');
      top.className = 'track-card-top';

      const canvas = document.createElement('canvas');
      canvas.className = 'track-thumb';
      canvas.width  = 260;
      canvas.height = 140;
      top.appendChild(canvas);

      if (locked) {
        const lock = document.createElement('div');
        lock.className = 'track-lock';
        lock.innerHTML = `<span class="track-lock-ico">🔒</span><span>Earn ★★★ on the forward lap</span>`;
        top.appendChild(lock);
      } else {
        const stars = document.createElement('div');
        stars.className = 'track-stars';
        const filled = starsOf(record?.pps);
        for (let s = 0; s < 5; s++) {
          const sp = document.createElement('span');
          sp.textContent = '★';
          sp.className = s < filled ? 'star-lit' : 'star-dim';
          stars.appendChild(sp);
        }
        top.appendChild(stars);
      }

      const scorePanel = document.createElement('div');
      scorePanel.className = 'track-card-score';
      scorePanel.innerHTML = record
        ? `<span class="tcs-label">Best score</span>` +
          `<span class="tcs-pps">${record.pps.toLocaleString()} <span class="tcs-unit">PPS</span></span>` +
          `<span class="tcs-label">Total</span>` +
          `<span class="tcs-total">${record.total.toLocaleString()} pts</span>` +
          `<span class="tcs-time">${record.time.toFixed(1)} s</span>`
        : `<span class="tcs-none">—</span>`;
      top.appendChild(scorePanel);
      card.appendChild(top);

      const body = document.createElement('div');
      body.className = 'track-card-body';

      const name = document.createElement('div');
      name.className   = 'track-card-name';
      name.textContent = track.name + (reversed ? ' ↺' : '');

      const desc = document.createElement('div');
      desc.className   = 'track-card-desc';
      desc.textContent = locked
        ? 'Locked — earn 3★ on the forward lap to unlock the reversed variant.'
        : track.desc;

      body.appendChild(name);
      body.appendChild(desc);

      if (!locked) {
        const rec = document.createElement('div');
        rec.className = 'track-card-record';
        rec.innerHTML = record
          ? `Score: <span class="val">${record.pps.toLocaleString()} PPS</span><span class="rec-sub">(Total: ${record.total.toLocaleString()} · ${record.time.toFixed(1)} s)</span>`
          : '—';
        body.appendChild(rec);

        // Collectible chips (caps + tires), keyed by this instance.
        const meta = document.createElement('div');
        meta.className = 'track-meta';
        if (track.caps > 0) {
          const collected = collectedCaps(inst).length;
          const chip = document.createElement('span');
          chip.className = 'track-chip cap' + (collected >= track.caps ? ' is-done' : '');
          chip.textContent = collected + '/' + track.caps + ' cap' + (track.caps !== 1 ? 's' : '');
          meta.appendChild(chip);
        }
        if (track.tires > 0) {
          const got = tiresFor(inst).length;
          const chip = document.createElement('span');
          chip.className = 'track-chip tire' + (got >= track.tires ? ' is-done' : '');
          chip.textContent = '🛞 ' + got + '/' + track.tires;
          meta.appendChild(chip);
        }
        if (meta.children.length) body.appendChild(meta);
      }

      card.appendChild(body);
      container.appendChild(card);

      drawThumb(canvas, track.svgSrc, track.theme);   // R5 will mirror the art for reversed
    }

    requestAnimationFrame(() => { container.scrollTop = 0; });
  }

  // ── Direction toggle ───────────────────────────────────────────────────────────
  const btnNormal   = document.getElementById('btn-normal');
  const btnReversed = document.getElementById('btn-reversed');
  const setMode = (reversed) => {
    btnNormal.classList.toggle('is-active', !reversed);
    btnReversed.classList.toggle('is-active', reversed);
    renderCards(reversed);
  };
  btnNormal.addEventListener('click', () => setMode(false));
  btnReversed.addEventListener('click', () => setMode(true));

  renderCards(false);
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
