<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1160" viewBox="0 0 1160 1160" font-family="-apple-system, Segoe UI, system-ui, sans-serif">
  <rect width="1160" height="1160" fill="#14110f"/>
