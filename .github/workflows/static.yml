name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Two jobs so (1) tests gate the deploy — a red build never reaches the live site, even on a direct
# push to main; and (2) a transient Pages/artifact-service failure in `deploy` can be re-run on its
# own ("Re-run failed jobs") reusing the already-built artifact, without rebuilding. GitHub Pages
# keeps serving the last successful deploy, so a failed run never takes the live site down.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test (gate the deploy — do not ship a red build)
        run: npm test
      - name: Build (minify JS + CSS)
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
