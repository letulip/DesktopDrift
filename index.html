<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Desktop Drift</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desktop Drift">
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/menu.css" />
</head>
<body>
<div id="menu">
  <div class="menu-inner">
    <img src="icons/icon-192.png" alt="Desktop Drift" style="width:64px; height:64px; margin-bottom:16px;border-radius: 50%;" />
    <h1 class="logo">DESKTOP DRIFT</h1>
    <p class="tagline">Top-down drift racing across the kitchen table</p>
    <div class="tiles">
      <a class="tile" href="select.html?mode=sandbox">
        <div class="tile-title">Sandbox</div>
        <div class="tile-sub">Free roam the table circuit. No limits — just learn the slide.</div>
        <span class="tile-badge">▶ Play</span>
      </a>
      <a class="tile" href="select.html?mode=timeattack">
        <div class="tile-title">Time Attack</div>
        <div class="tile-sub">Chase your best lap against the clock.</div>
        <span class="tile-badge">▶ Play</span>
      </a>
    </div>
    <div class="menu-foot">Keyboard: ← → to steer</div>
    <div class="menu-foot" style="margin-top:28px;">
      <a href="donate.html" style="color:inherit; opacity:.75; text-decoration:none; transition:opacity .15s;"
         onmouseover="this.style.opacity='.95'" onmouseout="this.style.opacity='.75'">
        ☕ Support the Dev ☕
      </a>
    </div>
  </div>
</div>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
