<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Desktop Drift — Free Browser Drift Racing Game</title>
<meta name="description" content="Desktop Drift is a free top-down drift racing game that runs entirely in your browser. No download needed. Pick your car, choose a colour and neon, then drift around the kitchen table.">
<link rel="canonical" href="https://letulip.github.io/DesktopDrift/">
<!-- Open Graph -->
<meta property="og:type"        content="website">
<meta property="og:url"         content="https://letulip.github.io/DesktopDrift/">
<meta property="og:title"       content="Desktop Drift — Free Browser Drift Racing Game">
<meta property="og:description" content="Top-down drift racing game. Free, no install. Choose your car, add neon underglow, and drift on the kitchen table track.">
<meta property="og:image"       content="https://letulip.github.io/DesktopDrift/icons/icon-512.png">
<meta name="twitter:card"       content="summary">
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desktop Drift">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/content.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/wallet.css">
<link rel="stylesheet" href="css/tracks.css">
<link rel="stylesheet" href="css/select.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/achievements.css">
<link rel="stylesheet" href="css/ach-toast.css">
<!-- Game screen (tpl-game) styles: HUD, pause/exit/results overlays. Scoped to game-only ids +
     body.zen, so it never touches the menu screens (SPA Phase C). -->
<link rel="stylesheet" href="css/sandbox.css">
<link rel="stylesheet" href="css/donate.css">
</head>
<body>
<!-- SPA shell. Every screen (menu, game, sandbox, donate) mounts here via the hash router
     (js/router.js); their markup lives in the <template>s below. The legacy *.html URLs are thin
     redirect shims (js/redirect-shim.js) that bounce into these hash routes. -->
<div id="app"></div>

  <template id="tpl-menu">
    <div id="menu">
      <div class="menu-inner">
        <div class="logo-wrapper">
          <img src="icons/icon-192.png" alt="Desktop Drift" class="menu-logo" />
          <h1 class="logo">DESKTOP DRIFT<sup>TM</sup></h1>
        </div>
        <p class="tagline">Top-down drift racing across the kitchen table</p>
        <div class="menu-crown" id="menu-crown" style="display: none;" title="Absolute DDK — a crown on every track, both directions">👑 Absolute DDK</div>
        <div class="tiles">
          <a class="tile" href="select.html?mode=sandbox">
            <div class="tile-title">Sandbox</div>
            <div class="tile-sub">Free roam the table circuit.<br>No limits — just learn the slide.</div>
            <span class="tile-badge">▶ Play</span>
          </a>
          <a class="tile" href="tracks.html">
            <div class="tile-title">Time Attack</div>
            <div class="tile-sub">Chase your best lap. Choose a track.</div>
            <div class="tile-stat" id="ta-avg-pps">No records yet<span id="ta-caps" style="display:none"></span></div>
            <span class="tile-badge">▶ Play</span>
          </a>
          <a class="tile" href="zen.html">
            <div class="tile-title">Zen Drift</div>
            <div class="tile-sub">No score, no timer, no pressure.<br>Just drift.</div>
            <span class="tile-badge">▶ Play</span>
          </a>
        </div>
        <div class="menu-links">
          <a class="settings-link" href="achievements.html">🏆 Achievements</a>
          <a class="settings-link" href="settings.html">⚙ Settings</a>
        </div>
        <!-- <div class="menu-foot" id="menu-wallet" style="display:none">Tires: <span id="wallet-count">0</span></div> -->
        <div class="menu-foot">Keyboard: ← → to steer</div>
        <div class="menu-foot menu-foot-support">
          <a href="donate.html" class="support-link">☕ Support the Dev ☕</a>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-tracks">
    <div id="track-select">
    
      <header id="ts-header">
        <div class="ts-header-row">
          <div class="ts-header-text">
            <h1 id="ts-title">Time Attack</h1>
            <p  id="ts-sub">Choose a track</p>
          </div>
          <div class="wallet-pill" title="Tire coins">🛞 <span id="wallet-amount">0</span></div>
        </div>
        <div id="ts-mode">
          <button class="mode-btn is-active" id="btn-normal">Normal</button>
          <button class="mode-btn" id="btn-reversed">Reversed</button>
        </div>
      </header>
    
      <div id="content">
        <div id="track-cards"></div>
      </div>
    
      <footer id="ts-footer">
        <a href="index.html" class="ts-back">← Back to menu</a>
      </footer>
    
    </div>
  </template>

  <template id="tpl-zen">
    <div id="track-select">
    
      <header id="ts-header">
        <h1 id="ts-title">Zen Drift</h1>
        <p  id="ts-sub">Choose a track — just drift</p>
      </header>
    
      <div id="content">
        <div id="track-cards"></div>
      </div>
    
      <footer id="ts-footer">
        <a href="index.html" class="ts-back">← Back to menu</a>
      </footer>
    
    </div>
  </template>

  <template id="tpl-select">
    <div id="garage">
    
      <header id="ts-header">
        <div class="ts-header-text">
          <h1 id="mode-title"></h1>
          <p id="ts-sub">Choose your car</p>
        </div>
        <div class="wallet-pill" title="Tire coins">🛞 <span id="wallet-amount">0</span></div>
      </header>
    
      <div id="content" class="content--column">
    
        <div id="cars"></div>
        <div id="car-dots" class="car-dots"></div>
    
        <button id="raceBtn">Race! 🏁</button>
      </div>
    
    
      <footer id="ts-footer">
        <a id="backLink" href="index.html" class="ts-back">← Back to menu</a>
      </footer>
    </div>
  </template>

  <template id="tpl-modify">
    <div id="modify">
    
      <header id="ts-header">
        <div class="ts-header-text">
          <h1 id="car-name"></h1>
          <p id="ts-sub">Customize &amp; buy</p>
        </div>
        <div class="wallet-pill" title="Tire coins">🛞 <span id="wallet-amount">0</span></div>
      </header>
    
      <div id="content" class="content--column content--modify">
    
        <div class="preview-stage">
          <canvas id="preview"></canvas>
        </div>
    
        <!-- All customization in one tabbed selector (one panel shown at a time) -->
        <div id="custom">
          <div class="shop-tabs" role="tablist">
            <button class="shop-tab is-active" type="button" data-panel="colour">Colour</button>
            <button class="shop-tab" type="button" data-panel="neon">Neon FX</button>
            <button class="shop-tab" type="button" data-panel="trail">Trail</button>
            <button class="shop-tab" type="button" data-panel="flair">Flair</button>
          </div>
    
          <!-- Only the panels scroll; header + preview + tabs stay pinned above -->
          <div id="panels">
          <!-- Colour: body colour (free) + finish (paid) — they belong together -->
          <div class="cust-panel" data-panel="colour">
            <div id="body-palette" class="swatch-grid"></div>
            <div id="body-name" class="swatch-name"></div>
            <div class="finish-sub">
              <div class="cust-sublabel">Finish</div>
              <div id="shop-finish" class="shop-grid"></div>
            </div>
            <div class="finish-sub">
              <div class="cust-sublabel">Glass tint</div>
              <div id="shop-glass" class="shop-grid"></div>
            </div>
            <div class="finish-sub">
              <div class="cust-sublabel">Outline</div>
              <div id="shop-outline" class="shop-grid"></div>
            </div>
          </div>
    
          <!-- Neon FX underglow — on/off + layout + per-zone colours + animation -->
          <div class="cust-panel" data-panel="neon" hidden>
            <button id="neon-btn" type="button">✦ Underglow</button>
            <div id="neon-controls" style="display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .2s;">
              <div class="finish-sub">
                <div class="cust-sublabel">Layout</div>
                <div id="neon-layout" class="shop-grid"></div>
              </div>
              <div id="neon-colors" style="display:flex;flex-direction:column;align-items:center;gap:12px;"></div>
              <div class="finish-sub">
                <div class="cust-sublabel">Animation</div>
                <div id="neon-anim" class="shop-grid"></div>
              </div>
            </div>
          </div>
    
          <!-- Trail colour (paid) -->
          <div class="cust-panel" data-panel="trail" hidden>
            <div id="shop-trail" class="shop-grid"></div>
          </div>
    
          <!-- Flair: external add-ons. First sub-section = Moods (windshield eye/expression, paid) -->
          <div class="cust-panel" data-panel="flair" hidden>
            <div class="finish-sub">
              <div class="cust-sublabel">Moods</div>
              <div id="shop-moods" class="shop-grid"></div>
            </div>
          </div>
          </div><!-- /#panels -->
        </div>
    
      </div>
    
      <footer id="modify-bar">
        <div id="buy-warning" class="buy-warning" hidden></div>
        <div class="modify-bar-row">
          <a id="backLink" class="ts-back" href="select.html">← Back</a>
          <button id="applyBtn" type="button">Apply</button>
        </div>
      </footer>
    </div>
  </template>

  <template id="tpl-settings">
    <div id="settings-page">
      <p id="settings-title">Settings</p>
    
      <div class="settings-group">
        <div class="settings-label">Speed units</div>
        <div class="unit-row">
          <button class="unit-btn" id="btn-kmh">km/h</button>
          <button class="unit-btn" id="btn-mph">mph</button>
        </div>
      </div>
    
      <div class="settings-group" id="haptics-group" style="display:none">
        <div class="settings-label">Haptic feedback</div>
        <div class="unit-row">
          <button class="unit-btn" id="btn-hap-on">On</button>
          <button class="unit-btn" id="btn-hap-off">Off</button>
        </div>
      </div>
    
      <div class="settings-group" id="sound-group">
        <div class="settings-label">Sound</div>
        <div class="unit-row">
          <button class="unit-btn" id="btn-snd-on">On</button>
          <button class="unit-btn" id="btn-snd-off">Off</button>
        </div>
      </div>
    
      <div class="settings-group" id="volume-group">
        <div class="settings-label">Volume</div>
        <div class="unit-row">
          <button class="unit-btn" id="btn-vol-low">Low</button>
          <button class="unit-btn" id="btn-vol-med">Med</button>
          <button class="unit-btn" id="btn-vol-high">High</button>
        </div>
      </div>
    
      <div class="settings-group" id="profile-group">
        <div class="settings-label">Profile / Sync</div>
        <div class="profile-desc">Move your progress to another device. Export here, then import on the other device.</div>
        <div class="unit-row">
          <button class="unit-btn" id="btn-profile-copy">Copy code</button>
          <button class="unit-btn" id="btn-profile-download">Download file</button>
        </div>
        <textarea id="profile-input" class="profile-input" rows="3" spellcheck="false"
                  autocapitalize="off" autocomplete="off"
                  placeholder="Paste a profile code here to import…"></textarea>
        <div class="unit-row">
          <button class="unit-btn" id="btn-profile-import">Import from code</button>
          <label class="unit-btn" for="profile-file">Import from file</label>
          <input type="file" id="profile-file" accept="application/json,.json" hidden>
        </div>
        <div id="profile-status" class="profile-status" role="status" aria-live="polite"></div>
      </div>
    
      <a id="backLink" href="index.html">← Back to menu</a>
    </div>
  </template>

  <template id="tpl-achievements">
    <div id="ach-page">
    
      <header id="ach-header">
        <h1 id="ach-title">Achievements</h1>
        <div id="ach-count" title="Unlocked / total">0 / 0</div>
      </header>
    
      <div id="ach-content">
        <div id="ach-sections"></div>
      </div>
    
      <footer id="ach-footer">
        <a href="index.html" class="ach-back">← Menu</a>
      </footer>
    
    </div>
  </template>

  <template id="tpl-game">
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="hud-left">
        <div class="panel" id="timePanel">
          <div>lap: <span class="big" id="lap">0.00</span> s</div>
          <div class="dim">last: <span id="last">—</span></div>
          <div class="dim">best: <span id="best">—</span></div>
        </div>
        <canvas id="mini" width="156" height="134"></canvas>
      </div>
      <div id="controls">
        <button id="menuBtn" title="back to menu">☰ Menu</button>
      </div>
      <div id="hud-right">
        <div class="panel" id="scorePanel">
          <div>score: <span class="big" id="score">0</span></div>
          <div class="dim" id="lapScores"></div>
          <div class="dim">speed: <span id="spd">0.0</span> <span id="spdUnit"></span></div>
          <div class="dim" id="tiresRow">tires: <span id="wallet">0</span></div>
        </div>
        <div id="lapCounter"><span id="lapNum">1</span>/<span id="lapTotal">-</span></div>
      </div>
    </div>
    <div id="combo"></div>
    <div id="flash"></div>
    <div id="count"></div>
    <div id="hint">Hold the LEFT half of the screen to steer left, the RIGHT half to steer right (or ← → keys). Drift through the corners. Dodge the obstacles!</div>
  </template>

  <template id="tpl-donate">
    <div id="menu">
      <div class="menu-inner">
        <div class="logo-wrapper">
          <img src="icons/icon-192.png" alt="Desktop Drift" class="menu-logo" />
          <h1 class="logo">DESKTOP DRIFT<sup>TM</sup></h1>
        </div>
        <h2 class="tagline">Support the project</h2>

        <p class="donate-intro">
          The game is free – and stays that way. If the drifts and the
          table circuit brought you any joy, a small tip via&nbsp;Bybit&nbsp;Pay
          is genuinely appreciated.
        </p>
        <p class="donate-intro">
          It keeps new tracks and features coming.&nbsp;🙏
        </p>

        <div class="donate-card">
          <div class="uid-label">Bybit UID</div>
          <div class="uid-value" id="uid">25422832</div>

          <button class="btn-copy" id="copyBtn">Copy UID</button>

          <a class="btn-bybit"
             href="https://www.bybit.com/en/bybitpay/"
             target="_blank" rel="noopener noreferrer">
            Open Bybit Pay &rarr;
          </a>

          <p class="steps">
            Bybit&nbsp;Pay&nbsp;&rarr;&nbsp;Send&nbsp;&rarr;&nbsp;search&nbsp;by&nbsp;UID&nbsp;&rarr;&nbsp;any&nbsp;amount
          </p>
        </div>

        <a class="back-link" href="index.html">&#8592; Back to menu</a>
      </div>
    </div>
  </template>

<script type="module">
  import { startRouter } from './js/router.js';
  startRouter();
</script>
<script type="module" src="./js/sw-update.js"></script>
</body>
</html>
