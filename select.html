<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Desktop Drift — Garage</title>
  <meta name="description" content="Choose your car and customise your look in the Desktop Drift garage. Pick a body colour and neon underglow, then hit the track.">
  <meta name="robots" content="noindex, follow">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <meta name="theme-color" content="#14110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desktop Drift">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/select.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/content.css">
</head>
<body>
<div id="garage">

  <div id="wallet-hud" title="Tire coins">🛞 <span id="wallet-amount">0</span></div>

  <header id="ts-header">
    <h1 id="mode-title"></h1>
    <p id="ts-sub">Choose your car</p>
  </header>

  <div id="content" class="content--column">

   <div id="cars"></div>

    <button id="raceBtn">Race! 🏁</button>
  </div>


  <footer id="ts-footer">
    <a id="backLink" href="index.html" class="ts-back">← Back to menu</a>
  </footer>
</div>

<script type="module">
  import { CARS, GU_TO_KMH } from './js/config.js';
  import { garage, save, wallet } from './js/store.js';
  import { drawCarPreview, CANVAS_W, CANVAS_H } from './js/car-preview.js';
  import { TRACKS } from './js/track-registry.js';

  const params    = new URLSearchParams(location.search);
  const trackId   = params.get('track');                          // e.g. 'green-study'
  const rawMode   = params.get('mode');                           // 'zen', 'sandbox', or null
  const isZen     = rawMode === 'zen';
  const mode      = trackId ? 'timeattack' : (rawMode || 'sandbox');
  const trackMeta = trackId ? TRACKS.find(t => t.id === trackId) : null;

  // Back button leads to track list (if we came from there) or to the main menu
  document.getElementById('backLink').href = isZen ? 'zen.html' : trackMeta ? 'tracks.html' : 'index.html';

  document.getElementById('mode-title').textContent =
    trackMeta ? trackMeta.name : mode === 'sandbox' ? 'Sandbox' : 'Time Attack';

  if (isZen) document.getElementById('raceBtn').textContent = 'Start Zen';

  // Wallet HUD
  document.getElementById('wallet-amount').textContent = wallet();

  // ── Restore the saved look (global, applied to every car preview) ─────────────
  const g = garage();
  g.carIndex = Math.max(0, Math.min(g.carIndex ?? 0, CARS.length - 1));
  let sel = g.carIndex;
  if (g.bodyColor) CARS.forEach(M => { M.body = g.bodyColor; });
  const neonColor = g.neonColor || null;
  const finish    = g.finish || null;

  // ── Stat ratings (0–10 cells) ────────────────────────────────────────────────
  // Scale is intentionally above current values — headroom for future upgrades.
  const SPEED_MAX_KMH  = 15;   // 10 cells = 15 km/h (physical limit of a 1:64 model)
  const STEER_MAX      = 5.0;  // max steer accounting for future upgrades
  const LOWTURN_MAX    = 0.5;  // max lowSpeedTurn accounting for future upgrades
  const THRUST_MAX     = 900;  // max thrust accounting for future upgrades

  const speedRating = (d) =>
    Math.min(10, Math.round(d.maxSpeed * GU_TO_KMH / SPEED_MAX_KMH * 10));

  const handlingRating = (d) =>
    Math.min(10, Math.round(
      (d.steer / STEER_MAX * 0.7 + d.lowSpeedTurn / LOWTURN_MAX * 0.3) * 10
    ));

  const accRating = (d) =>
    Math.min(10, Math.round(d.thrust / THRUST_MAX * 10));

  const makeStatRow = (label, n, cls) => {
    const row = document.createElement('div');
    row.className = 'stat-row';
    const lbl = document.createElement('span');
    lbl.className = 'stat-lbl'; lbl.textContent = label;
    const bar = document.createElement('div');
    bar.className = 'stat-bar';
    for (let i = 0; i < 10; i++) {
      const cell = document.createElement('div');
      cell.className = 'stat-cell' + (i < n ? ' ' + cls : '');
      bar.appendChild(cell);
    }
    row.appendChild(lbl); row.appendChild(bar);
    return row;
  };

  // ── Car cards (pick a car; gear opens the modify screen) ──────────────────────
  const carsEl = document.getElementById('cars');

  // Gear → modify.html for that car, carrying the current track/mode params.
  const modifyHref = (i) => {
    const p = new URLSearchParams(params);
    p.set('car', i);
    return 'modify.html?' + p.toString();
  };

  const cards = CARS.map((M, i) => {
    const card = document.createElement('div');
    card.className = 'car-card' + (i === sel ? ' sel' : '');

    const cvs = document.createElement('canvas');
    cvs.width  = CANVAS_W;
    cvs.height = CANVAS_H;
    card.appendChild(cvs);

    // Modify (gear) — opens the per-car customization screen. The gear glyph is the
    // accent-coloured icons/settings.svg, applied via CSS mask (see .car-modify).
    const gear = document.createElement('a');
    gear.className = 'car-modify';
    gear.href      = modifyHref(i);
    gear.title     = 'Modify';
    gear.setAttribute('aria-label', 'Modify');
    gear.addEventListener('click', (e) => e.stopPropagation());  // don't trigger card select
    card.appendChild(gear);

    const stats = document.createElement('div');
    stats.className = 'car-stats';
    stats.appendChild(makeStatRow('spd', speedRating(M._drive),    'spd'));
    stats.appendChild(makeStatRow('hdl', handlingRating(M._drive), 'hdl'));
    stats.appendChild(makeStatRow('acc', accRating(M._drive),      'acc'));
    card.appendChild(stats);

    const nm = document.createElement('div');
    nm.className   = 'car-name';
    nm.textContent = M.name;
    card.appendChild(nm);

    card.addEventListener('click', () => selectCar(i));
    carsEl.appendChild(card);
    return { card, cvs };
  });

  const selectCar = (i) => {
    sel = i;
    cards.forEach((c, j) => c.card.classList.toggle('sel', j === i));
    garage().carIndex = i; save();
  };

  // ── Race button ──────────────────────────────────────────────────────────────
  document.getElementById('raceBtn').addEventListener('click', () => {
    garage().carIndex = sel; save();
    if (isZen) location.href = `game.html?track=${trackMeta.id}&mode=zen`;
    else location.href = trackMeta ? `game.html?track=${trackMeta.id}` : 'sandbox.html';
  });

  // ── Initial render — each car shows the saved look; selected one shows neon ────
  CARS.forEach((M, i) => drawCarPreview(cards[i].cvs, M, i === sel ? neonColor : null, finish));
</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
