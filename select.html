<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Desktop Drift — Garage</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desktop Drift">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
  <style>
    #garage {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(120% 120% at 50% 0%, #2a2622 0%, #14110f 55%, #0b0907 100%);
      font: 14px/1.4 -apple-system, system-ui, sans-serif; color: #fff;
      gap: 16px; padding: 20px; box-sizing: border-box;
    }
    #mode-title {
      margin: 0;
      font: 800 clamp(26px, 7vw, 44px) -apple-system, system-ui, sans-serif;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #fff 0%, #ffb14d 130%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    #garage h2 { margin: 0; font: 600 16px -apple-system, system-ui, sans-serif; opacity: .6; }
    #cars { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .car-card {
      max-width: 170px;
      box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 14px; border-radius: 16px;
      background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.12);
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .car-card:hover { border-color: #ffb14d; }
    .car-card.sel { border-color: #ffb14d; background: rgba(255,177,77,.08); }
    .car-card canvas {
      display: block;
      width: min(200px, 38vw);
      aspect-ratio: 220 / 82;
    }
    .car-name { font: 600 14px -apple-system, system-ui, sans-serif; letter-spacing: .2px; }

    /* ── Colour palette ─────────────────────────────────────────────────────── */
    .palette-section {
      display: flex; flex-direction: column; align-items: center; gap: 7px;
    }
    .palette-label {
      font: 600 11px -apple-system, system-ui, sans-serif;
      letter-spacing: .6px; text-transform: uppercase;
      color: rgba(255,255,255,.38);
    }
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      width: min(300px, calc(100vw - 48px));
    }
    .swatch {
      width: 100%; aspect-ratio: 1; border-radius: 50%;
      cursor: pointer;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.4);
      transition: transform .1s;
      outline: none;
    }
    .swatch:hover { transform: scale(1.18); }
    .swatch.sel {
      box-shadow:
        0 0 0 2.5px #ffb14d,
        0 0 0 4.5px rgba(255,177,77,.25),
        inset 0 1px 2px rgba(0,0,0,.4);
      transform: scale(1.1);
    }
    .swatch-name {
      font: 500 12px -apple-system, system-ui, sans-serif;
      letter-spacing: .3px; color: rgba(255,255,255,.5);
      min-height: 15px;
    }

    /* ── Neon toggle ────────────────────────────────────────────────────────── */
    #neon-section { display: flex; flex-direction: column; align-items: center; gap: 7px; }
    #neon-btn {
      --nc: #39FF14;
      padding: 6px 18px;
      border-radius: 20px;
      border: 1.5px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.45);
      font: 600 13px -apple-system, system-ui, sans-serif;
      letter-spacing: .4px; cursor: pointer;
      transition: border-color .2s, color .2s, box-shadow .2s, text-shadow .2s;
    }
    #neon-btn.active {
      border-color: var(--nc);
      color: var(--nc);
      text-shadow: 0 0 6px var(--nc);
      box-shadow: 0 0 14px var(--nc);
    }
    #neon-palette-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      overflow: hidden;
      max-height: 0; opacity: 0;
      transition: max-height .25s ease, opacity .2s ease;
    }
    #neon-palette-wrap.open { max-height: 80px; opacity: 1; }

    /* neon swatches use coloured ring instead of amber */
    #neon-palette .swatch.sel {
      box-shadow:
        0 0 0 2.5px var(--ring, #39FF14),
        0 0 8px var(--ring, #39FF14),
        inset 0 1px 2px rgba(0,0,0,.4);
    }

    #raceBtn {
      padding: 14px 48px;
      background: rgba(255,177,77,.18); border: 1px solid rgba(255,177,77,.4);
      color: #ffb14d; font: 700 17px -apple-system, system-ui, sans-serif;
      border-radius: 14px; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    #raceBtn:hover { background: rgba(255,177,77,.28); border-color: rgba(255,177,77,.7); }
    #backLink {
      color: rgba(255,255,255,.35);
      font: 13px -apple-system, system-ui, sans-serif;
      text-decoration: none; transition: color .15s;
    }
    #backLink:hover { color: rgba(255,255,255,.6); }

    @media (min-width: 480px) {
      .car-card { max-width: none; box-sizing: content-box; }
    }
  </style>
</head>
<body>
<div id="garage">
  <p id="mode-title"></p>
  <h2>Choose your car</h2>
  <div id="cars"></div>

  <!-- Body colour -->
  <div class="palette-section">
    <div class="palette-label">Body colour</div>
    <div id="body-palette" class="swatch-grid"></div>
    <div id="body-name" class="swatch-name"></div>
  </div>

  <!-- Neon underglow -->
  <div id="neon-section">
    <button id="neon-btn">✦ Neon</button>
    <div id="neon-palette-wrap">
      <div id="neon-palette" class="swatch-grid"></div>
      <div id="neon-name" class="swatch-name"></div>
    </div>
  </div>

  <button id="raceBtn">Race! 🏁</button>
  <a id="backLink" href="index.html">← Back to menu</a>
</div>

<script type="module">
  import { CARS } from './js/config.js';
  import { PALETTE, NEON_PALETTE } from './js/palette.js';
  import { garage, save } from './js/store.js';

  const params = new URLSearchParams(location.search);
  const mode   = params.get('mode') || 'sandbox';

  document.getElementById('mode-title').textContent =
    mode === 'timeattack' ? 'Time Attack' : 'Sandbox';

  // ── Restore from store ───────────────────────────────────────────────────────
  const g = garage();
  g.carIndex = Math.max(0, Math.min(g.carIndex ?? 0, CARS.length - 1));

  let sel = g.carIndex;
  if (g.bodyColor) CARS[sel].body = g.bodyColor;

  // Neon state — global preference (not per-car).
  let neonEnabled = !!g.neonColor;
  let selNeon     = g.neonColor
    ? Math.max(0, NEON_PALETTE.findIndex(p => p.hex === g.neonColor))
    : 0;

  // ── Car preview canvas ───────────────────────────────────────────────────────
  const CANVAS_W = 220, CANVAS_H = 82;

  const drawPreview = (cvs, M, neonColor = null) => {
    const ctx = cvs.getContext('2d');
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    const pad = 6;
    const sc  = Math.min((CANVAS_W - pad * 2) / M.vw, (CANVAS_H - pad * 2) / M.vh);
    ctx.save();
    ctx.translate(CANVAS_W / 2, CANVAS_H / 2);
    ctx.scale(M.flip ? -sc : sc, sc);
    ctx.translate(-M.vw / 2, -M.vh / 2);
    // Neon glow — три секции: нос→передний мост | между мостами | задний мост→корма.
    // Рисуем в path-координатах (после scale+translate), до корпуса машины.
    if (neonColor) {
      const glowH = M.vh * 0.55;
      const gy    = (M.vh - glowH) / 2;
      const axPx  = M.vw * 0.20;   // расстояние от конца до оси моста
      const hwPx  = M.vw * 0.08;   // полудлина колеса

      ctx.shadowColor = neonColor;
      ctx.shadowBlur  = 18;
      ctx.globalAlpha = 0.65;
      ctx.fillStyle   = neonColor;

      ctx.beginPath();
      ctx.rect(0,                  gy, axPx - hwPx,             glowH);  // конец 1 (нос/корма)
      ctx.rect(axPx + hwPx,        gy, M.vw - 2*(axPx + hwPx), glowH);  // между мостами
      ctx.rect(M.vw - axPx + hwPx, gy, axPx - hwPx,            glowH);  // конец 2
      ctx.fill();

      ctx.globalAlpha = 1;
      ctx.shadowBlur  = 0;
      ctx.shadowColor = 'transparent';
    }
    ctx.fillStyle = M.body;
    ctx.fill(M._p2d);
    if (M.details) for (const d of M.details) { ctx.fillStyle = d.c; ctx.fill(d._p2d); }
    ctx.lineJoin   = 'round';
    ctx.lineWidth  = 5;
    ctx.strokeStyle = M.stroke;
    ctx.stroke(M._p2d);
    if (M._lines) for (const lp of M._lines) ctx.stroke(lp);
    ctx.restore();
  };

  const redrawSelected = () =>
    drawPreview(cards[sel].cvs, CARS[sel], neonEnabled ? NEON_PALETTE[selNeon].hex : null);

  // ── Car cards ────────────────────────────────────────────────────────────────
  const carsEl = document.getElementById('cars');

  const cards = CARS.map((M, i) => {
    const card = document.createElement('div');
    card.className = 'car-card' + (i === sel ? ' sel' : '');

    const cvs = document.createElement('canvas');
    cvs.width  = CANVAS_W;
    cvs.height = CANVAS_H;
    card.appendChild(cvs);

    const nm = document.createElement('div');
    nm.className   = 'car-name';
    nm.textContent = M.name;
    card.appendChild(nm);

    card.addEventListener('click', () => selectCar(i));
    carsEl.appendChild(card);
    return { card, cvs };
  });

  const selectCar = (i) => {
    sel = i;
    cards.forEach((c, j) => c.card.classList.toggle('sel', j === i));
    // Sync body palette highlight to this car's current body colour.
    const match = PALETTE.findIndex(p => p.hex === CARS[i].body);
    selBody = match;
    bodySwatchEls.forEach((el, j) => el.classList.toggle('sel', j === match));
    bodyName.textContent = match >= 0 ? PALETTE[match].name : '';
    redrawSelected();
  };

  // ── Body colour palette ──────────────────────────────────────────────────────
  const bodyPaletteEl = document.getElementById('body-palette');
  const bodyName      = document.getElementById('body-name');

  const findBody = hex => PALETTE.findIndex(p => p.hex.toLowerCase() === hex.toLowerCase());
  let selBody = findBody(CARS[sel].body);

  const bodySwatchEls = PALETTE.map((entry, idx) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (idx === selBody ? ' sel' : '');
    el.style.background = entry.hex;
    el.title = entry.name;
    el.addEventListener('click', () => applyBody(idx));
    bodyPaletteEl.appendChild(el);
    return el;
  });

  const applyBody = (idx) => {
    const entry = PALETTE[idx];
    CARS[sel].body = entry.hex;
    selBody = idx;
    bodySwatchEls.forEach((el, j) => el.classList.toggle('sel', j === idx));
    bodyName.textContent = entry.name;
    redrawSelected();
  };

  bodyName.textContent = selBody >= 0 ? PALETTE[selBody].name : '';

  // ── Neon underglow ───────────────────────────────────────────────────────────
  const neonBtn        = document.getElementById('neon-btn');
  const neonPaletteWrap = document.getElementById('neon-palette-wrap');
  const neonPaletteEl  = document.getElementById('neon-palette');
  const neonName       = document.getElementById('neon-name');

  const updateNeonBtn = () => {
    const nc = NEON_PALETTE[selNeon].hex;
    neonBtn.style.setProperty('--nc', nc);
    neonBtn.classList.toggle('active', neonEnabled);
    neonPaletteWrap.classList.toggle('open', neonEnabled);
    // Update neon swatch ring colour to match selection
    neonPaletteEl.style.setProperty('--ring', nc);
  };

  const neonSwatchEls = NEON_PALETTE.map((entry, idx) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (idx === selNeon ? ' sel' : '');
    el.style.background = entry.hex;
    el.title = entry.name;
    el.addEventListener('click', () => applyNeon(idx));
    neonPaletteEl.appendChild(el);
    return el;
  });

  const applyNeon = (idx) => {
    selNeon = idx;
    neonSwatchEls.forEach((el, j) => el.classList.toggle('sel', j === idx));
    neonName.textContent = NEON_PALETTE[idx].name;
    updateNeonBtn();
    redrawSelected();
  };

  neonBtn.addEventListener('click', () => {
    neonEnabled = !neonEnabled;
    updateNeonBtn();
    redrawSelected();
  });

  // Init neon UI state
  neonName.textContent = NEON_PALETTE[selNeon].name;
  updateNeonBtn();

  // ── Race button ──────────────────────────────────────────────────────────────
  document.getElementById('raceBtn').addEventListener('click', () => {
    const g = garage();
    g.carIndex  = sel;
    g.bodyColor = CARS[sel].body;
    g.neonColor = neonEnabled ? NEON_PALETTE[selNeon].hex : null;
    save();
    location.href = mode === 'timeattack' ? 'timeattack.html' : 'sandbox.html';
  });

  // ── Initial render ───────────────────────────────────────────────────────────
  const initNeon = neonEnabled ? NEON_PALETTE[selNeon].hex : null;
  CARS.forEach((M, i) => drawPreview(cards[i].cvs, M, i === sel ? initNeon : null));
</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
