<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Desktop Drift — Garage</title>
  <meta name="description" content="Choose your car and customise your look in the Desktop Drift garage. Pick a body colour and neon underglow, then hit the track.">
  <meta name="robots" content="noindex, follow">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="theme-color" content="#14110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desktop Drift">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/select.css">
</head>
<body>
<div id="garage">
  <p id="mode-title"></p>
  <h2>Choose your car</h2>
  <div id="cars"></div>

  <!-- Body colour -->
  <div class="palette-section">
    <div class="palette-label">Body colour</div>
    <div id="body-palette" class="swatch-grid"></div>
    <div id="body-name" class="swatch-name"></div>
  </div>

  <!-- Neon underglow -->
  <div id="neon-section">
    <button id="neon-btn">✦ Neon</button>
    <div id="neon-palette-wrap">
      <div id="neon-palette" class="swatch-grid"></div>
      <div id="neon-name" class="swatch-name"></div>
    </div>
  </div>

  <button id="raceBtn">Race! 🏁</button>
  <a id="backLink" href="index.html">← Back to menu</a>
</div>

<script type="module">
  import { CARS, GU_TO_KMH } from './js/config.js';
  import { PALETTE, NEON_PALETTE } from './js/palette.js';
  import { garage, save } from './js/store.js';

  const params = new URLSearchParams(location.search);
  const mode   = params.get('mode') || 'sandbox';

  document.getElementById('mode-title').textContent =
    mode === 'timeattack' ? 'Time Attack' : 'Sandbox';

  // ── Restore from store ───────────────────────────────────────────────────────
  const g = garage();
  g.carIndex = Math.max(0, Math.min(g.carIndex ?? 0, CARS.length - 1));

  let sel = g.carIndex;
  if (g.bodyColor) CARS[sel].body = g.bodyColor;

  // Neon state — global preference (not per-car).
  let neonEnabled = !!g.neonColor;
  let selNeon     = g.neonColor
    ? Math.max(0, NEON_PALETTE.findIndex(p => p.hex === g.neonColor))
    : 0;

  // ── Stat ratings (0–10 cells) ────────────────────────────────────────────────
  // Масштаб намеренно выше текущих значений — оставляем запас для модификаций.
  const SPEED_MAX_KMH  = 15;   // 10 клеток = 15 км/ч (физический предел 1:64-модели)
  const STEER_MAX      = 5.0;  // макс. steer с учётом будущих апгрейдов
  const LOWTURN_MAX    = 0.5;  // макс. lowSpeedTurn с учётом будущих апгрейдов
  const THRUST_MAX     = 900;  // макс. thrust с учётом будущих апгрейдов

  const speedRating = (d) =>
    Math.min(10, Math.round(d.maxSpeed * GU_TO_KMH / SPEED_MAX_KMH * 10));

  const handlingRating = (d) =>
    Math.min(10, Math.round(
      (d.steer / STEER_MAX * 0.7 + d.lowSpeedTurn / LOWTURN_MAX * 0.3) * 10
    ));

  const accRating = (d) =>
    Math.min(10, Math.round(d.thrust / THRUST_MAX * 10));

  const makeStatRow = (label, n, cls) => {
    const row = document.createElement('div');
    row.className = 'stat-row';
    const lbl = document.createElement('span');
    lbl.className = 'stat-lbl'; lbl.textContent = label;
    const bar = document.createElement('div');
    bar.className = 'stat-bar';
    for (let i = 0; i < 10; i++) {
      const cell = document.createElement('div');
      cell.className = 'stat-cell' + (i < n ? ' ' + cls : '');
      bar.appendChild(cell);
    }
    row.appendChild(lbl); row.appendChild(bar);
    return row;
  };

  // ── Car preview canvas ───────────────────────────────────────────────────────
  const CANVAS_W = 220, CANVAS_H = 82;

  const drawPreview = (cvs, M, neonColor = null) => {
    const ctx = cvs.getContext('2d');
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    const pad = 6;
    const sc  = Math.min((CANVAS_W - pad * 2) / M.vw, (CANVAS_H - pad * 2) / M.vh);
    ctx.save();
    ctx.translate(CANVAS_W / 2, CANVAS_H / 2);
    ctx.scale(M.flip ? -sc : sc, sc);
    ctx.translate(-M.vw / 2, -M.vh / 2);
    // Neon glow — три секции: нос→передний мост | между мостами | задний мост→корма.
    // 3% конец | 15.5% колесо | 58% между мостами | 15.5% колесо | 8% конец
    // Рисуем в path-координатах (после scale+translate), до корпуса машины.
    if (neonColor) {
      const glowH = M.vh * 0.70;
      const gy    = (M.vh - glowH) / 2;
      const s1p = M.vw * 0.03, s2p = M.vw * 0.58, s3p = M.vw * 0.08;
      const gpp = M.vw * 0.155;  // зазор на колесо

      ctx.shadowColor = neonColor;
      ctx.shadowBlur  = 18;
      ctx.globalAlpha = 0.65;
      ctx.fillStyle   = neonColor;

      const ei_p = M.vw * 0.02;  // отступ от торцов пути
      ctx.beginPath();
      ctx.rect(ei_p,         gy, s1p - ei_p, glowH);  // конец 1 (не доходит до края)
      ctx.rect(s1p + gpp,    gy, s2p,        glowH);  // между мостами
      ctx.rect(M.vw - s3p,   gy, s3p - ei_p, glowH);  // конец 2 (не доходит до края)
      ctx.fill();

      ctx.globalAlpha = 1;
      ctx.shadowBlur  = 0;
      ctx.shadowColor = 'transparent';
    }
    ctx.fillStyle = M.body;
    ctx.fill(M._p2d);
    if (M.details) for (const d of M.details) { ctx.fillStyle = d.c; ctx.fill(d._p2d); }
    ctx.lineJoin   = 'round';
    ctx.lineWidth  = 5;
    ctx.strokeStyle = M.stroke;
    ctx.stroke(M._p2d);
    if (M._lines) for (const lp of M._lines) ctx.stroke(lp);
    ctx.restore();
  };

  const redrawSelected = () =>
    drawPreview(cards[sel].cvs, CARS[sel], neonEnabled ? NEON_PALETTE[selNeon].hex : null);

  // ── Car cards ────────────────────────────────────────────────────────────────
  const carsEl = document.getElementById('cars');

  const cards = CARS.map((M, i) => {
    const card = document.createElement('div');
    card.className = 'car-card' + (i === sel ? ' sel' : '');

    const cvs = document.createElement('canvas');
    cvs.width  = CANVAS_W;
    cvs.height = CANVAS_H;
    card.appendChild(cvs);

    const stats = document.createElement('div');
    stats.className = 'car-stats';
    stats.appendChild(makeStatRow('spd', speedRating(M._drive),    'spd'));
    stats.appendChild(makeStatRow('hdl', handlingRating(M._drive), 'hdl'));
    stats.appendChild(makeStatRow('acc', accRating(M._drive),      'acc'));
    card.appendChild(stats);

    const nm = document.createElement('div');
    nm.className   = 'car-name';
    nm.textContent = M.name;
    card.appendChild(nm);

    card.addEventListener('click', () => selectCar(i));
    carsEl.appendChild(card);
    return { card, cvs };
  });

  const selectCar = (i) => {
    sel = i;
    cards.forEach((c, j) => c.card.classList.toggle('sel', j === i));
    // Sync body palette highlight to this car's current body colour.
    const match = PALETTE.findIndex(p => p.hex === CARS[i].body);
    selBody = match;
    bodySwatchEls.forEach((el, j) => el.classList.toggle('sel', j === match));
    bodyName.textContent = match >= 0 ? PALETTE[match].name : '';
    redrawSelected();
  };

  // ── Body colour palette ──────────────────────────────────────────────────────
  const bodyPaletteEl = document.getElementById('body-palette');
  const bodyName      = document.getElementById('body-name');

  const findBody = hex => PALETTE.findIndex(p => p.hex.toLowerCase() === hex.toLowerCase());
  let selBody = findBody(CARS[sel].body);

  const bodySwatchEls = PALETTE.map((entry, idx) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (idx === selBody ? ' sel' : '');
    el.style.background = entry.hex;
    el.title = entry.name;
    el.addEventListener('click', () => applyBody(idx));
    bodyPaletteEl.appendChild(el);
    return el;
  });

  const applyBody = (idx) => {
    const entry = PALETTE[idx];
    CARS[sel].body = entry.hex;
    selBody = idx;
    bodySwatchEls.forEach((el, j) => el.classList.toggle('sel', j === idx));
    bodyName.textContent = entry.name;
    redrawSelected();
  };

  bodyName.textContent = selBody >= 0 ? PALETTE[selBody].name : '';

  // ── Neon underglow ───────────────────────────────────────────────────────────
  const neonBtn        = document.getElementById('neon-btn');
  const neonPaletteWrap = document.getElementById('neon-palette-wrap');
  const neonPaletteEl  = document.getElementById('neon-palette');
  const neonName       = document.getElementById('neon-name');

  const updateNeonBtn = () => {
    const nc = NEON_PALETTE[selNeon].hex;
    neonBtn.style.setProperty('--nc', nc);
    neonBtn.classList.toggle('active', neonEnabled);
    neonPaletteWrap.classList.toggle('open', neonEnabled);
    // Update neon swatch ring colour to match selection
    neonPaletteEl.style.setProperty('--ring', nc);
  };

  const neonSwatchEls = NEON_PALETTE.map((entry, idx) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (idx === selNeon ? ' sel' : '');
    el.style.background = entry.hex;
    el.title = entry.name;
    el.addEventListener('click', () => applyNeon(idx));
    neonPaletteEl.appendChild(el);
    return el;
  });

  const applyNeon = (idx) => {
    selNeon = idx;
    neonSwatchEls.forEach((el, j) => el.classList.toggle('sel', j === idx));
    neonName.textContent = NEON_PALETTE[idx].name;
    updateNeonBtn();
    redrawSelected();
  };

  neonBtn.addEventListener('click', () => {
    neonEnabled = !neonEnabled;
    updateNeonBtn();
    redrawSelected();
  });

  // Init neon UI state
  neonName.textContent = NEON_PALETTE[selNeon].name;
  updateNeonBtn();

  // ── Race button ──────────────────────────────────────────────────────────────
  document.getElementById('raceBtn').addEventListener('click', () => {
    const g = garage();
    g.carIndex  = sel;
    g.bodyColor = CARS[sel].body;
    g.neonColor = neonEnabled ? NEON_PALETTE[selNeon].hex : null;
    save();
    location.href = mode === 'timeattack' ? 'timeattack.html' : 'sandbox.html';
  });

  // ── Initial render ───────────────────────────────────────────────────────────
  const initNeon = neonEnabled ? NEON_PALETTE[selNeon].hex : null;
  CARS.forEach((M, i) => drawPreview(cards[i].cvs, M, i === sel ? initNeon : null));
</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
