<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Desktop Drift — Settings</title>
  <meta name="description" content="Settings for Desktop Drift — configure speed units and other game preferences.">
  <meta name="robots" content="noindex, follow">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <meta name="theme-color" content="#14110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desktop Drift">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div id="settings-page">
  <p id="settings-title">Settings</p>

  <div class="settings-group">
    <div class="settings-label">Speed units</div>
    <div class="unit-row">
      <button class="unit-btn" id="btn-kmh">km/h</button>
      <button class="unit-btn" id="btn-mph">mph</button>
    </div>
  </div>

  <div class="settings-group" id="haptics-group" style="display:none">
    <div class="settings-label">Haptic feedback</div>
    <div class="unit-row">
      <button class="unit-btn" id="btn-hap-on">On</button>
      <button class="unit-btn" id="btn-hap-off">Off</button>
    </div>
  </div>

  <a id="backLink" href="index.html">← Back to menu</a>
</div>

<script type="module">
  import { settings, save } from './js/store.js';

  const s      = settings();
  const btnKmh = document.getElementById('btn-kmh');
  const btnMph = document.getElementById('btn-mph');

  const apply = (units) => {
    s.units = units;
    save();
    btnKmh.classList.toggle('sel', units === 'kmh');
    btnMph.classList.toggle('sel', units === 'mph');
  };

  btnKmh.addEventListener('click', () => apply('kmh'));
  btnMph.addEventListener('click', () => apply('mph'));

  // Restore saved choice
  apply(s.units ?? 'kmh');

  // Haptic feedback toggle — only shown when the Vibration API is available.
  if ('vibrate' in navigator) {
    const group   = document.getElementById('haptics-group');
    const btnOn   = document.getElementById('btn-hap-on');
    const btnOff  = document.getElementById('btn-hap-off');

    const applyHaptics = (on) => {
      s.haptics = on;
      save();
      btnOn .classList.toggle('sel', on);
      btnOff.classList.toggle('sel', !on);
    };

    btnOn .addEventListener('click', () => applyHaptics(true));
    btnOff.addEventListener('click', () => applyHaptics(false));

    group.style.display = '';   // show only on supported devices
    applyHaptics(s.haptics ?? true);
  }
</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
