<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Desktop Drift — Settings</title>
  <meta name="description" content="Settings for Desktop Drift — configure speed units and other game preferences.">
  <meta name="robots" content="noindex, follow">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <meta name="theme-color" content="#14110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desktop Drift">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div id="settings-page">
  <p id="settings-title">Settings</p>

  <div class="settings-group">
    <div class="settings-label">Speed units</div>
    <div class="unit-row">
      <button class="unit-btn" id="btn-kmh">km/h</button>
      <button class="unit-btn" id="btn-mph">mph</button>
    </div>
  </div>

  <div class="settings-group" id="haptics-group" style="display:none">
    <div class="settings-label">Haptic feedback</div>
    <div class="unit-row">
      <button class="unit-btn" id="btn-hap-on">On</button>
      <button class="unit-btn" id="btn-hap-off">Off</button>
    </div>
  </div>

  <div class="settings-group" id="sound-group">
    <div class="settings-label">Sound</div>
    <div class="unit-row">
      <button class="unit-btn" id="btn-snd-on">On</button>
      <button class="unit-btn" id="btn-snd-off">Off</button>
    </div>
  </div>

  <div class="settings-group" id="volume-group">
    <div class="settings-label">Volume</div>
    <div class="unit-row">
      <button class="unit-btn" id="btn-vol-low">Low</button>
      <button class="unit-btn" id="btn-vol-med">Med</button>
      <button class="unit-btn" id="btn-vol-high">High</button>
    </div>
  </div>

  <div class="settings-group" id="profile-group">
    <div class="settings-label">Profile / Sync</div>
    <div class="profile-desc">Move your progress to another device. Export here, then import on the other device.</div>
    <div class="unit-row">
      <button class="unit-btn" id="btn-profile-copy">Copy code</button>
      <button class="unit-btn" id="btn-profile-download">Download file</button>
    </div>
    <textarea id="profile-input" class="profile-input" rows="3" spellcheck="false"
              autocapitalize="off" autocomplete="off"
              placeholder="Paste a profile code here to import…"></textarea>
    <div class="unit-row">
      <button class="unit-btn" id="btn-profile-import">Import from code</button>
      <label class="unit-btn" for="profile-file">Import from file</label>
      <input type="file" id="profile-file" accept="application/json,.json" hidden>
    </div>
    <div id="profile-status" class="profile-status" role="status" aria-live="polite"></div>
  </div>

  <a id="backLink" href="index.html">← Back to menu</a>
</div>

<script type="module">
  import { settings, save } from './js/store.js';
  import { initProfileSync } from './js/profile-sync.js';
  import { sfx } from './js/sound.js';
  import { VOLUME_LEVELS, levelForVolume } from './js/sound-params.js';

  const s      = settings();
  const btnKmh = document.getElementById('btn-kmh');
  const btnMph = document.getElementById('btn-mph');

  const apply = (units) => {
    s.units = units;
    save();
    btnKmh.classList.toggle('sel', units === 'kmh');
    btnMph.classList.toggle('sel', units === 'mph');
  };

  btnKmh.addEventListener('click', () => apply('kmh'));
  btnMph.addEventListener('click', () => apply('mph'));

  // Restore saved choice
  apply(s.units ?? 'kmh');

  // Haptic feedback toggle — only shown when the Vibration API is available.
  if ('vibrate' in navigator) {
    const group   = document.getElementById('haptics-group');
    const btnOn   = document.getElementById('btn-hap-on');
    const btnOff  = document.getElementById('btn-hap-off');

    const applyHaptics = (on) => {
      s.haptics = on;
      save();
      btnOn .classList.toggle('sel', on);
      btnOff.classList.toggle('sel', !on);
    };

    btnOn .addEventListener('click', () => applyHaptics(true));
    btnOff.addEventListener('click', () => applyHaptics(false));

    group.style.display = '';   // show only on supported devices
    applyHaptics(s.haptics ?? true);
  }

  // Sound on/off — always shown (Web Audio is universal). `quiet` skips the confirmation
  // blip on initial restore so the page doesn't chirp on load.
  const btnSndOn  = document.getElementById('btn-snd-on');
  const btnSndOff = document.getElementById('btn-snd-off');
  const applySound = (on, quiet) => {
    s.soundEnabled = on;
    save();
    btnSndOn .classList.toggle('sel', on);
    btnSndOff.classList.toggle('sel', !on);
    if (on && !quiet) sfx.toggle();
  };
  btnSndOn .addEventListener('click', () => applySound(true));
  btnSndOff.addEventListener('click', () => applySound(false));
  applySound(s.soundEnabled ?? true, true);

  // Volume — three discrete levels (a button-row, no slider). Auditions the new level on click.
  const volBtns = {
    low:  document.getElementById('btn-vol-low'),
    med:  document.getElementById('btn-vol-med'),
    high: document.getElementById('btn-vol-high'),
  };
  const applyVolume = (level, quiet) => {
    s.volume = VOLUME_LEVELS[level] ?? VOLUME_LEVELS.med;
    save();
    for (const k in volBtns) volBtns[k].classList.toggle('sel', k === level);
    if (!quiet && (s.soundEnabled ?? true)) sfx.tap();
  };
  for (const k in volBtns) volBtns[k].addEventListener('click', () => applyVolume(k));
  applyVolume(levelForVolume(s.volume), true);

  // Profile / Sync — export & import the full save (see js/profile-sync.js).
  initProfileSync();
</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
