<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Desktop Drift — Settings</title>
  <meta name="description" content="Settings for Desktop Drift — configure speed units and other game preferences.">
  <meta name="robots" content="noindex, follow">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desktop Drift">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
  <style>
    #settings-page {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(120% 120% at 50% 0%, #2a2622 0%, #14110f 55%, #0b0907 100%);
      font: 14px/1.4 -apple-system, system-ui, sans-serif; color: #fff;
      gap: 36px; padding: 24px;
    }
    #settings-title {
      margin: 0;
      font: 800 clamp(26px, 7vw, 44px) -apple-system, system-ui, sans-serif;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #fff 0%, #ffb14d 130%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .settings-group {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .settings-label {
      font: 600 11px -apple-system, system-ui, sans-serif;
      letter-spacing: .6px; text-transform: uppercase;
      color: rgba(255,255,255,.4);
    }
    .unit-row { display: flex; gap: 8px; }
    .unit-btn {
      padding: 10px 32px; border-radius: 12px;
      border: 1.5px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.5);
      font: 600 15px -apple-system, system-ui, sans-serif;
      cursor: pointer; transition: all .15s;
    }
    .unit-btn.sel {
      border-color: #ffb14d;
      background: rgba(255,177,77,.15);
      color: #ffb14d;
    }
    .unit-btn:not(.sel):hover {
      border-color: rgba(255,255,255,.3);
      color: rgba(255,255,255,.75);
    }
    #backLink {
      color: rgba(255,255,255,.35);
      font: 13px -apple-system, system-ui, sans-serif;
      text-decoration: none; transition: color .15s;
    }
    #backLink:hover { color: rgba(255,255,255,.6); }
  </style>
</head>
<body>
<div id="settings-page">
  <p id="settings-title">Settings</p>

  <div class="settings-group">
    <div class="settings-label">Speed units</div>
    <div class="unit-row">
      <button class="unit-btn" id="btn-kmh">km/h</button>
      <button class="unit-btn" id="btn-mph">mph</button>
    </div>
  </div>

  <a id="backLink" href="index.html">← Back to menu</a>
</div>

<script type="module">
  import { settings, save } from './js/store.js';

  const s      = settings();
  const btnKmh = document.getElementById('btn-kmh');
  const btnMph = document.getElementById('btn-mph');

  const apply = (units) => {
    s.units = units;
    save();
    btnKmh.classList.toggle('sel', units === 'kmh');
    btnMph.classList.toggle('sel', units === 'mph');
  };

  btnKmh.addEventListener('click', () => apply('kmh'));
  btnMph.addEventListener('click', () => apply('mph'));

  // Restore saved choice
  apply(s.units ?? 'kmh');
</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
