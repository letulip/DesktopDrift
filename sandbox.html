<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Desktop Drift — Sandbox</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/sandbox.css" />
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-start;">
    <div class="panel" id="timePanel">
      <div>lap: <span class="big" id="lap">0.00</span> s</div>
      <div class="dim">last: <span id="last">—</span></div>
      <div class="dim">best: <span id="best">—</span></div>
    </div>
    <canvas id="mini" width="156" height="134"></canvas>
  </div>
  <div id="controls" style="display:flex; gap:8px; align-items:center; pointer-events:auto;">
    <button id="menuBtn" title="back to menu">☰ Menu</button>
    <button id="carBtn" class="panel" style="border:none; color:#fff; font:inherit; cursor:pointer;">🚗</button>
    <input id="bodyColor" type="color" value="#474d56" title="body color" style="width:34px; height:34px; border:none; background:none; padding:0; cursor:pointer;">
  </div>
  <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end;">
    <div class="panel" style="text-align:right">
      <div>score: <span class="big" id="score">0</span></div>
      <div class="dim" id="lapScores"></div>
      <div class="dim">speed: <span id="spd">0</span></div>
    </div>
    <div id="lapCounter"><span id="lapNum">1</span>/-</div>
  </div>
</div>
<div id="combo"></div>
<div id="flash"></div>
<div id="count"></div>
<div id="hint">Hold the LEFT half of the screen to steer left, the RIGHT half to steer right (or ← → keys). Drift through the corners. Hit a cone — penalty!</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
